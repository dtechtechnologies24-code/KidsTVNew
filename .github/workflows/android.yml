name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project structure
        run: |
          test -f KidsLearnTV/settings.gradle.kts
          test -f KidsLearnTV/build.gradle.kts
          test -f KidsLearnTV/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: KidsLearnTV
        run: gradle assembleDebug --stacktrace

      - name: Locate generated APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-tv-app
          path: KidsLearnTV/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
